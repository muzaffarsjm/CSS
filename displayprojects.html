<!DOCTYPE html>
<html>
  <head>
    <title>
      Exercises related to diplay properties of CSS
    </title>
    <link rel="stylesheet" href="displayprojects.css">
  </head>
  <body>
    <p>Survey inquiry:</p>
    <div class="first-box">
      <p>Thank you for chatting with our customer support.
        Would you like to take our quick survey?
      </p>
      <button class="survey-button">Yes</button>
      <button class="survey-button">No</button>
    </div>
    <p>Login form:</p>
    <div class="register-form">
      <input type="text" placeholder="Name" class="name-input">
      <input type="text" placeholder="Email" class="email-input">
    </div>
    <p>Google home page:</p>
    <div class="google-page">
      <img src="googlelogo.jpeg" alt="google-logo" class="logo-picture">
      <input type="text" class="google-input" placeholder="
      Search Google or type a URL">
    </div>

    <p>Sign up form</p>
    <div class="signup-form">
      <input type="text" placeholder="First name" class="first-name">
      <input type="text" placeholder="Family name" class="family-name">
      <input type="text" class="email" placeholder="Email">
      <button class="join-button">Sign Up</button>
    </div>

    <p>Uber request-a-ride form:</p>
    <div> 
      <p>Request a ride now</p>
      <input type="text" class="location" placeholder="Enter pickup location">
      <input type="text" class="destination" placeholder="Enter destination">
      <button>Request now</button>
      <button>Schedule for later</button>
    </div>
  </body>
</html>
