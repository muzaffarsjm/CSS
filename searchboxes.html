<!DOCTYPE html>
<html>
  <head>
    <title>
      Search Boxes
    </title>
    <link rel="stylesheet" href="searchboxes.css">
  </head>
  <body>
    <div class="simple-search">
      <input type="text" placeholder="Search" 
      class="first-box">
    </div>

    <div class="second-box">
      <p>Google search</p>
      <input type="text" class="google" 
      placeholder="Search Google or type a URL">
    </div>
    
    <div class="linkedin-box">
      <p>Linkedin signup</p>
      <p>Email</p>
      <input type="text" class="linkedin">
      <p class="linkedin-explanation">
        By clicking Agree & Join,
         you agree to thePrivacy Policy
      </p>
      <button class="join-button">Agree & Join</button>
    </div>
    <div class="last-twitter">
      <img src="" alt="">
      <p>What's happening?</p>
      <button>Tweet</button>
    </div>
  </body>
</html>
